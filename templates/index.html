<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dropout Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#4e73df,#1cc88a);
            min-height:100vh;
            font-family:Arial,Helvetica,sans-serif;
        }

        .main-card{
            background:white;
            border-radius:20px;
            padding:40px;
            margin-top:40px;
            box-shadow:0 15px 40px rgba(0,0,0,.2);
        }

        h1{
            font-weight:bold;
            color:#4e73df;
        }

        .section-title{
            color:#4e73df;
            margin-top:25px;
            margin-bottom:20px;
            border-left:5px solid #4e73df;
            padding-left:10px;
            font-weight:bold;
        }

        .btn-custom{
            width:100%;
            padding:14px;
            font-size:20px;
            border-radius:10px;
        }

        .result{
            margin-top:30px;
            text-align:center;
            padding:20px;
            border-radius:10px;
            background:#eef7ff;
        }
    </style>
</head>

<body>

<div class="container">

<div class="main-card">

<div class="text-center mb-4">
<h1>🎓 Student Dropout Prediction</h1>
<p class="text-muted">
Predict whether a student is at risk of dropping out using Machine Learning.
</p>
</div>

<form action="/predict" method="POST">

<h4 class="section-title">👤 Student Information</h4>

<div class="row">

<div class="col-md-4 mb-3">
<label>Age</label>
<input type="number" class="form-control" name="Age" required>
</div>

<div class="col-md-4 mb-3">
<label>Gender</label>
<select class="form-select" name="Gender">
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="col-md-4 mb-3">
<label>Year of Study</label>
<select class="form-select" name="Year_of_Study">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
</select>
</div>

</div>

<h4 class="section-title">📚 Academic Information</h4>

<div class="row">

<div class="col-md-6 mb-3">
<label>Attendance (%)</label>
<input type="number" class="form-control" name="Attendance_Percent">
</div>

<div class="col-md-6 mb-3">
<label>Study Hours Per Day</label>
<input type="number" step="0.1" class="form-control" name="Study_Hours_Per_Day">
</div>

<div class="col-md-6 mb-3">
<label>Previous GPA</label>
<input type="number" step="0.01" class="form-control" name="Previous_GPA">
</div>

<div class="col-md-6 mb-3">
<label>Backlogs</label>
<input type="number" class="form-control" name="Backlogs">
</div>

</div>

<h4 class="section-title">🧠 Mental Health</h4>

<div class="row">

<div class="col-md-4 mb-3">
<label>Financial Stress</label>
<input type="number" min="1" max="10" class="form-control" name="Financial_Stress_Score">
</div>

<div class="col-md-4 mb-3">
<label>Stress Level</label>
<input type="number" min="1" max="10" class="form-control" name="Stress_Level">
</div>

<div class="col-md-4 mb-3">
<label>Burnout Level</label>
<select class="form-select" name="Burnout_Level">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>
</div>

</div>

<div class="d-grid mt-4">
<button class="btn btn-primary btn-custom">
🔍 Predict Dropout Risk
</button>
</div>

</form>

{% if prediction %}

<div class="result">

<h3>Prediction Result</h3>

<h2>{{ prediction }}</h2>

<h4>Confidence : {{ confidence }}%</h4>

</div>

{% endif %}

</div>

</div>

</body>
</html>
